app:
  name: omniflow-go
  env: local
  version: 0.1.0

server:
  host: 0.0.0.0
  port: 8850
  mode: debug
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 10s

log:
  format: text
  level: debug
  add_source: true
  console:
    enabled: true
    color: true
  file:
    enabled: false
    path: ./logs/omniflow-go.log
    max_size_mb: 100
    max_backups: 10
    max_age_days: 30
    compress: true
    local_time: true

database:
  dsn: postgres://postgres:123456@host.docker.internal:5432/omniflow?sslmode=disable
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m
  log_level: silent
  debug_sql: false

redis:
  addr: host.docker.internal:6379
  password: ""
  db: 0

storage:
  provider: minio

minio:
  endpoint: host.docker.internal:9000
  public_endpoint: localhost:9000
  access_key: admin
  secret_key: admin123
  use_ssl: false
  bucket: my-bucket

upload:
  chunk_size_bytes: 10485760
  session_ttl: 24h
